[project]
name = "story-workbench"
version = "0.1.0"
description = "AI 小说创作与故事工程系统：作者决定故事，AI 讨论、写作与检查，本地 CLI 闭环"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.5",
]

[project.scripts]
story-workbench = "story_workbench.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["story_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
